title: TCP three-way handshake
story:
  takeaway: SYN, SYN-ACK, ACK sync both sides' sequence numbers before any data flows
  notes: >-
    x and y are each side's initial sequence number. The close is shown as a
    single FIN and ACK exchange; a real teardown is a four-way FIN/ACK sequence
    with TIME_WAIT on the side that closes first, and the badges switch to
    CLOSED/LISTEN as the exchange starts rather than as it finishes. The
    SYN-ACK is drawn blue (outbound) because it is a new segment, not a reply
    to data.
nodes:
  client: { label: Client, state: cstate }
  server: { label: Server, state: sstate, sublabel: port 443 }
edges:
  c2s: { from: client, to: server }
  s2c: { from: server, to: client }
states:
  cstate:
    values: [CLOSED, SYN_SENT, ESTABLISHED]
    tones: { CLOSED: neutral, SYN_SENT: warn, ESTABLISHED: ok }
  sstate:
    values: [LISTEN, SYN_RCVD, ESTABLISHED]
    tones: { LISTEN: neutral, SYN_RCVD: warn, ESTABLISHED: ok }
phases:
  - name: Listening
    caption: server waits on a passive open
    set: { cstate: CLOSED, sstate: LISTEN }
    duration: 1
  - name: SYN
    caption: client sends SYN, seq=x
    set: { cstate: SYN_SENT }
    flows:
      - { path: [c2s], outcome: ok, count: 1 }
  - name: SYN-ACK
    caption: server replies SYN-ACK, seq=y ack=x+1
    set: { sstate: SYN_RCVD }
    flows:
      - { path: [s2c], outcome: ok, count: 1 }
  - name: ACK
    caption: client sends ACK, ack=y+1
    set: { cstate: ESTABLISHED }
    flows:
      - { path: [c2s], outcome: ok, count: 1 }
  - name: Established
    caption: both sides exchange data
    set: { sstate: ESTABLISHED }
    flows:
      - { path: [c2s, s2c], outcome: ok, rate: 1/s }
  - name: Closed
    caption: FIN and ACK close it; server keeps listening
    set: { cstate: CLOSED, sstate: LISTEN }
    flows:
      - { path: [c2s, s2c], outcome: ok, count: 1 }
