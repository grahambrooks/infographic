title: Transactional outbox
story:
  takeaway: Commit the event with the data in one transaction; a relay publishes it later
  notes: >-
    The relay publishes, then marks the row sent. A crash between the two
    re-publishes the event, so delivery is at-least-once and consumers must be
    idempotent. Consumers downstream of the broker are not drawn. Polling is
    shown; log-tailing CDC (e.g. Debezium) is an equivalent relay.
nodes:
  service: { label: Order service }
  db:      { label: Database, sublabel: orders + outbox, state: outbox }
  relay:   { label: Outbox relay }
  broker:  { label: Message broker, state: broker }
edges:
  write:     { from: service, to: db }
  write_ack: { from: db, to: service }
  query:     { from: relay, to: db }
  rows:      { from: db, to: relay }
  publish:   { from: relay, to: broker }
  ack:       { from: broker, to: relay }
states:
  outbox:
    values: [PENDING, SENT]
    tones: { PENDING: warn, SENT: ok }
  broker:
    values: [UP, DOWN]
    tones: { UP: ok, DOWN: fail }
phases:
  - name: Atomic write
    caption: order row and outbox event commit in one transaction
    set: { outbox: PENDING, broker: UP }
    flows:
      - { path: [write, write_ack], outcome: ok, count: 2, label: TX, reply_label: commit }
  - name: Relay polls
    caption: relay reads the pending event from the outbox table
    flows:
      - { path: [query, rows], outcome: ok, count: 1, label: SELECT, reply_label: event }
  - name: Broker down
    caption: publish fails, so the row stays pending
    set: { broker: DOWN }
    flows:
      - { path: [publish, ack], outcome: fail, count: 1, label: event, reply_label: error }
  - name: Retry succeeds
    caption: after a backoff the relay retries and the broker acks
    set: { broker: UP }
    timer: { node: relay, label: backoff 2s, seconds: 2s }
    flows:
      - { path: [publish, ack], outcome: ok, count: 1, delay: 2s, label: event, reply_label: ack }
  - name: Marked sent
    caption: only after the ack does the relay mark the row sent
    set: { outbox: SENT }
    flows:
      - { path: [query, rows], outcome: ok, count: 1, label: UPDATE, reply_label: ok }
