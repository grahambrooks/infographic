title: Transactional outbox
story:
  takeaway: Commit the event with the data in one transaction; a relay publishes it later
  notes: >-
    The relay is drawn as a poller; log-tailing CDC (e.g. Debezium) plays the same role.
    Consumers are not drawn. Delivery is at-least-once: a relay crash between publish and mark-sent republishes the
    event, so consumers must deduplicate by event id. The backlog counter jumps to 3 at the
    start of the outage phase, and to 1 at the start of the publish phase, because the tool can only ramp counters on return legs.
nodes:
  svc:      { label: Order service }
  db:       { label: Database, sublabel: orders + outbox, counter: backlog }
  relay:    { label: Outbox relay }
  broker:   { label: Message broker, state: broker }
edges:
  write:    { from: svc, to: db, label: one tx }
  commit:   { from: db, to: svc }
  read:     { from: db, to: relay, label: unsent rows }
  publish:  { from: relay, to: broker }
  ack:      { from: broker, to: relay }
  mark:     { from: relay, to: db, label: mark sent }
states:
  broker:
    values: [UP, DOWN]
    tones: { UP: ok, DOWN: fail }
counters:
  backlog: { label: unsent }
phases:
  - name: Atomic write
    caption: order and event commit together
    set: { broker: UP, backlog: 0 }
    flows:
      - { path: [write, commit], outcome: ok, count: 1 }
  - name: Relay publishes
    caption: relay publishes it, then marks it sent
    set: { backlog: 1 }
    ramp: { backlog: 1..0 }
    flows:
      - { path: [read, publish, ack, mark], outcome: ok, count: 1 }
  - name: Broker down
    caption: orders still commit; events wait
    set: { broker: DOWN, backlog: 3 }
    flows:
      - { path: [write, commit], outcome: ok, rate: 0.8/s }
      - { path: [read, publish, ack], outcome: fail, rate: 0.6/s }
  - name: Broker back
    caption: relay retries and drains the outbox
    set: { broker: UP }
    ramp: { backlog: 3..0 }
    flows:
      - { path: [read, publish, ack, mark], outcome: ok, count: 3 }
