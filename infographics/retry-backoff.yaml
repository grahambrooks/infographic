title: Retry with exponential backoff
story:
  takeaway: Each retry waits twice as long as the last, giving a failing service room to recover
  notes: >-
    Delays are a fixed 1s, 2s, 4s doubling; each phase's timer is the wait after that failure, and phase lengths are stretched to hint at the growing gap (not to scale). Real clients add random
    jitter to each delay so retries from many clients don't arrive in sync, and
    give up (surfacing the error) after a maximum number of attempts. Only
    idempotent calls should be retried this way.
nodes:
  app:   { label: App }
  retry: { label: Retry client, counter: failures }
  svc:   { label: Service, state: health }
edges:
  call:   { from: app, to: retry }
  try:    { from: retry, to: svc }
  reply:  { from: svc, to: retry }
  result: { from: retry, to: app }
states:
  health:
    values: [UP, DOWN]
    tones: { UP: ok, DOWN: fail }
counters:
  failures: { label: failed attempts }
phases:
  - name: Normal calls
    caption: requests succeed on the first try
    set: { health: UP, failures: 0 }
    flows:
      - { path: [call, try, reply, result], outcome: ok, rate: 1/s }
  - name: Call fails
    caption: the service errors; wait 1s before retrying
    set: { health: DOWN }
    ramp: { failures: 0..1 }
    timer: { node: retry, label: backoff 1s }
    duration: 5.2
    flows:
      - { path: [call, try, reply], outcome: fail, count: 1 }
  - name: Retry 1 fails
    caption: the wait doubles to 2s
    ramp: { failures: 1..2 }
    timer: { node: retry, label: backoff 2s }
    duration: 5.5
    flows:
      - { path: [try, reply], outcome: fail, count: 1 }
  - name: Retry 2 fails
    caption: the wait doubles again to 4s
    ramp: { failures: 2..3 }
    timer: { node: retry, label: backoff 4s }
    duration: 7.5
    flows:
      - { path: [try, reply], outcome: fail, count: 1 }
  - name: Retry 3 succeeds
    caption: the service has recovered; the app gets its answer
    set: { health: UP, failures: 0 }
    flows:
      - { path: [try, reply, result], outcome: ok, count: 1 }
