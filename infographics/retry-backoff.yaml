title: Retry with exponential backoff
story:
  takeaway: Retry transient failures, doubling the wait each time so a struggling service can recover
  notes: >-
    Delays are shown without jitter (1s, 2s, 4s); real clients add random jitter
    to avoid synchronized retry storms, and cap both the delay and the attempt count
    (e.g. give up after 4 attempts; the cap is not drawn). Only safe-to-repeat (idempotent) calls should be retried.
nodes:
  client: { label: Client, sublabel: retry policy, counter: failures }
  svc:    { label: Service, state: health }
edges:
  call:  { from: client, to: svc }
  reply: { from: svc, to: client }
states:
  health:
    values: [OVERLOADED, RECOVERED]
    tones: { OVERLOADED: fail, RECOVERED: ok }
counters:
  failures: { label: failures }
phases:
  - name: First try
    caption: the call fails with a transient 503
    set: { health: OVERLOADED, failures: 0 }
    ramp: { failures: 0..1 }
    flows:
      - { path: [call, reply], outcome: fail, count: 1, label: GET, reply_label: "503" }
  - name: Wait 1s
    caption: back off 1s, then retry
    ramp: { failures: 1..2 }
    timer: { node: client, label: backoff 1s, seconds: 1s }
    flows:
      - { path: [call, reply], outcome: fail, count: 1, delay: 1s, label: GET, reply_label: "503" }
  - name: Wait 2s
    caption: the wait doubles to 2s; still failing
    ramp: { failures: 2..3 }
    timer: { node: client, label: backoff 2s, seconds: 2s }
    flows:
      - { path: [call, reply], outcome: fail, count: 1, delay: 2s, label: GET, reply_label: "503" }
  - name: Wait 4s
    caption: after 4s the retry succeeds
    set: { health: RECOVERED }
    timer: { node: client, label: backoff 4s, seconds: 4s }
    flows:
      - { path: [call, reply], outcome: ok, count: 1, delay: 4s, label: GET, reply_label: "200" }
  - name: Reset
    caption: success clears the count for the next outage
    set: { health: OVERLOADED, failures: 0 }
    duration: 2s
    flows: []
