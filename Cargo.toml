[package]
name = "infographic"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
fontcull = { version = "2.0.1", default-features = false }
