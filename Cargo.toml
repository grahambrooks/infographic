resvg = "0.48.1"
roxmltree = "0.21.1"
rustybuzz = "0.20.1"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2"
serde_json = "1.0.151"
ttf-parser = "0.25.1"
usvg = "0.48.1"
