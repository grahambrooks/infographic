[package]
name = "infographic"
version = "2026.10.1"
edition = "2024"
rust-version = "1.99.0"
description = "Claude Code skill and Rust CLI for verified, animated SVG infographics"
repository = "https://github.com/grahambrooks/infographic"
readme = "README.md"
# The CLI is MIT; IBM Plex Sans, compiled into the binary, is OFL-1.1.
license = "MIT AND OFL-1.1"
keywords = ["svg", "infographic", "animation", "diagram", "claude"]
categories = ["command-line-utilities", "visualization"]
exclude = ["/infographics", "/spikes", "/.claude", "/.github"]

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
fontcull = { version = "2.0.1", default-features = false }
indexmap = { version = "2.14.2", features = ["serde"] }
resvg = "0.48.1"
roxmltree = "0.21.1"
rustybuzz = "0.20.1"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2"
serde_json = "1.0.151"
ttf-parser = "0.25.1"
usvg = "0.48.1"
